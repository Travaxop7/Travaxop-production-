<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List | Local Storage App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-card">
            <!-- Header -->
            <div class="header">
                <h1>✓ My Tasks</h1>
                <p class="subtitle">Stay organized and productive</p>
            </div>

            <!-- Statistics -->
            <div class="stats">
                <div class="stat">
                    <span class="stat-value" id="totalTasks">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="completedTasks">0</span>
                    <span class="stat-label">Completed</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="pendingTasks">0</span>
                    <span class="stat-label">Pending</span>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..."
                    class="task-input"
                >
                <button id="addBtn" class="add-btn">+ Add</button>
            </div>

            <!-- Filters -->
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Task List -->
            <div class="task-list-container">
                <ul class="task-list" id="taskList">
                    <li class="empty-state">
                        <p>No tasks yet. Add one to get started! 🚀</p>
                    </li>
                </ul>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button id="clearCompletedBtn" class="action-btn clear-btn">Clear Completed</button>
                <button id="deleteAllBtn" class="action-btn delete-btn">Delete All</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
